[project]
name = "riscvm"
version = "0.1.1"
description = "A RISC-V machine emulator, written to drive real xv6-riscv boots instruction by instruction"
readme = "README.md"
authors = [
    { name = "Wenyang Duan", email = "wenyang.duan@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["riscvm"]
